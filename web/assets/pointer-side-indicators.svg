<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="184" viewBox="0 0 1000 184" role="img" aria-labelledby="title desc">
  <title id="title">Pointer-side indicators</title>
  <desc id="desc">GNOME indicator geometry using the shipped example configuration: scrolling, Free Spin, Drag View, Auto Scroll, and compatibility passthrough. Each cursor and indicator is enlarged together.</desc>
  <metadata>
    Adapted from Yaru Cursors by Sam Hewitt and the Ubuntu Yaru contributors.
    Source: https://github.com/ubuntu/yaru/blob/master/icons/src/cursors/source-cursors.svg
    License: Creative Commons Attribution-ShareAlike 4.0 International
    https://creativecommons.org/licenses/by-sa/4.0/
    Changes: extracted the default pointer paths, normalized the viewport,
    simplified the gradient, omitted the original shadow filters, and scaled
    the pointer for this indicator overview.
  </metadata>
  <!-- Source: extensions/gnome/config.example.json and extension.js drawing methods.
       One shared 2x scale per cursor/indicator group preserves all proportions.
       Scrolling dots illustrate max_alpha_speed (3200); Auto Scroll offset is (18,-14).
       Auto Scroll size=24 follows the shipped example (the no-config fallback is 48). -->
  <defs>
    <style>.label { fill:#334155; font:600 14px Arial,sans-serif; text-anchor:middle; }</style>
    <linearGradient id="yaru-cursor-fill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4d4d4d"/><stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <g id="cursor" transform="translate(-26 367.72852)" fill-rule="evenodd">
    <path fill="#fff" d="m 26,-367.72852 v 18 l 3.742187,-3.74023 1.53125,3.69727 c 0.223675,0.54007 0.671618,0.9677 1.169922,1.14453 0.498305,0.17682 1.010021,0.13312 1.449219,-0.0488 0.439208,-0.18193 0.83129,-0.51285 1.058594,-0.99024 0.227304,-0.47738 0.241155,-1.09464 0.01758,-1.63476 L 33.4375,-355 h 5.291016 z"/>
    <path fill="url(#yaru-cursor-fill)" d="m 27.000343,-365.31445 -3.46e-4,13.17245 3.092946,-3.0926 2.1048,5.0813 c 0.517545,1.24943 2.365223,0.48404 1.8477,-0.7654 l -2.1047,-5.0813 4.3736,2.3e-4 z"/>
    </g>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="183" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <path d="M200 28V156M400 28V156M600 28V156M800 28V156" stroke="#edf0f3"/>
  <g transform="translate(84 68) scale(2)">
    <g transform="translate(12 0)"><circle r="4" fill="#4ea1ff" opacity="0.9"/></g>
    <use href="#cursor"/>
  </g>
  <text x="100" y="148" class="label">Scrolling</text>
  <g transform="translate(281 68) scale(2)">
    <g transform="translate(12 0)"><circle r="6" fill="none" stroke="#4ea1ff" stroke-width="2" opacity="0.9"/><circle r="4" fill="#4ea1ff" opacity="0.9"/></g>
    <use href="#cursor"/>
  </g>
  <text x="300" y="148" class="label">Free Spin</text>
  <g transform="translate(479 68) scale(2)">
    <g transform="translate(12 0)"><g transform="translate(1 1)" color="#000" opacity="0.252"><path d="M-4 0H4M0 -4V4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M0 -8 -2 -4 2 -4Z M0 8 -2 4 2 4Z M-8 0 -4 -2 -4 2Z M8 0 4 -2 4 2Z" fill="currentColor"/></g><g color="#4ea1ff" opacity="0.9"><path d="M-4 0H4M0 -4V4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M0 -8 -2 -4 2 -4Z M0 8 -2 4 2 4Z M-8 0 -4 -2 -4 2Z M8 0 4 -2 4 2Z" fill="currentColor"/></g></g>
    <use href="#cursor"/>
  </g>
  <text x="500" y="148" class="label">Drag View</text>
  <g transform="translate(666 68) scale(2)">
    <g transform="translate(12 0)"><g transform="translate(1 1)" color="#000" opacity="0.304"><circle r="9.5" fill="none" stroke="currentColor" stroke-width="1"/><path d="M0 -6.5 -2 -2.5 2 -2.5Z M0 6.5 -2 2.5 2 2.5Z M-6.5 0 -2.5 -2 -2.5 2Z M6.5 0 2.5 -2 2.5 2Z" fill="currentColor"/></g><g color="#cbd5e1" opacity="0.95"><circle r="9.5" fill="none" stroke="currentColor" stroke-width="1"/><path d="M0 -6.5 -2 -2.5 2 -2.5Z M0 6.5 -2 2.5 2 2.5Z M-6.5 0 -2.5 -2 -2.5 2Z M6.5 0 2.5 -2 2.5 2Z" fill="currentColor"/></g><g transform="translate(18 -14)" opacity="0.95"><circle cx="1" cy="1" r="3" fill="#000" opacity="0.32"/><circle r="3" fill="#4ea1ff"/></g></g>
    <use href="#cursor"/>
  </g>
  <text x="700" y="148" class="label">Auto Scroll</text>
  <g transform="translate(884 68) scale(2)">
    <g transform="translate(12 0)"><g transform="translate(1 1)" color="#000" opacity="0.252"><path d="M-3 -3L3 3M3 -3L-3 3" stroke="currentColor" stroke-width="2"/></g><g color="#ff5c5c" opacity="0.9"><path d="M-3 -3L3 3M3 -3L-3 3" stroke="currentColor" stroke-width="2"/></g></g>
    <use href="#cursor"/>
  </g>
  <text x="900" y="139" class="label"><tspan x="900">Compatibility</tspan><tspan x="900" dy="18">passthrough</tspan></text>
</svg>
